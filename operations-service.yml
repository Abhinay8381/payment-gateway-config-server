spring:
  datasource:
    url: ${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5431/payment-gateway-operations-DB}

  cloud:
    openfeign:
      client:
        config:
          merchant-service:
            connectTimeout: 2000
            readTimeout: 3000
          payment-service:
            connectTimeout: 2000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      merchant-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      payment-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      merchant-service:
        max-attempts: 3
        wait-duration: 500ms
      payment-service:
        max-attempts: 3
        wait-duration: 500ms

server:
  port: 9020

app:
  kafka:
    webhook:
      delivery:
        redis-key: "webhook-retry"
        batch-size: 100
        header: X-Payment-Gateway-Signature

settlement:
 simulator:
   poll-interval-ms: 5000